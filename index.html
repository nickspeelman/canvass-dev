<!doctype html>
<html lang="en">
<head>
  !-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-30SN02B5HP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-30SN02B5HP');
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <title>Touch Instrument — v1.5</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app" aria-label="Touch drawing instrument">
    <section id="stage" class="stage" aria-label="Drawing canvas">
      <canvas id="paintCanvas"></canvas>
      <canvas id="liveCanvas"></canvas>
      <div id="touchHint" class="touch-hint">Touch the canvas</div>
    </section>

    <section class="controls" aria-label="Instrument controls">
      <div class="control-row behaviors" aria-label="Behaviors">
        <button class="behavior active" data-behavior="cycle" aria-pressed="true">Cycle</button>
        <button class="behavior" data-behavior="connect" aria-pressed="false">Connect</button>
        <button class="behavior" data-behavior="echo" aria-pressed="false">Echo</button>
        <button class="behavior" data-behavior="scatter" aria-pressed="false">Scatter</button>
        <button class="behavior" data-behavior="flow" aria-pressed="false">Flow</button>
        <button class="behavior" data-behavior="bloom" aria-pressed="false">Bloom</button>
        <button class="behavior" data-behavior="spray" aria-pressed="false">Spray</button>
        <button class="behavior" data-behavior="offset" aria-pressed="false">Offset</button>
        <button class="behavior" data-behavior="mirror" aria-pressed="false">Mirror</button>
        <button class="behavior" data-behavior="radial" aria-pressed="false">Radial</button>
        <button class="behavior" data-behavior="drift" aria-pressed="false">Drift</button>
        <button class="behavior" data-behavior="orbit" aria-pressed="false">Orbit</button>
        <button class="behavior" data-behavior="fractal" aria-pressed="false">Fractal</button>
        <button class="behavior" data-behavior="bleed" aria-pressed="false">Bleed</button>
      </div>

      <div class="control-row tools">
        <div class="swatches" aria-label="Color">
          <button class="swatch active" data-color="#e53935" aria-label="Red" aria-pressed="true" style="--swatch:#e53935"></button>
          <button class="swatch" data-color="#f6c90e" aria-label="Yellow" aria-pressed="false" style="--swatch:#f6c90e"></button>
          <button class="swatch" data-color="#1e66f5" aria-label="Blue" aria-pressed="false" style="--swatch:#1e66f5"></button>
          <button class="swatch" data-color="#111111" aria-label="Black" aria-pressed="false" style="--swatch:#111111"></button>
          <button class="swatch white" data-color="#ffffff" aria-label="White" aria-pressed="false" style="--swatch:#ffffff"></button>
        </div>

        <div class="sizes" aria-label="Brush size">
          <button class="size" data-size="6" aria-pressed="false">S</button>
          <button class="size active" data-size="16" aria-pressed="true">M</button>
          <button class="size" data-size="34" aria-pressed="false">L</button>
        </div>

        <div class="actions">
          <button id="fullscreenBtn" class="utility">Full screen</button>
          <button id="canvasSizeBtn" class="utility">Canvas size</button>
          <button id="saveBtn" class="utility">Save image</button>
          <button id="clearBtn" class="utility">Clear</button>
          <button id="finishBtn" class="utility primary">Finish</button>
        </div>
      </div>
    </section>
  </main>


  <dialog id="canvasDialog" class="settings-dialog">
    <form method="dialog" class="settings-card" id="canvasForm">
      <h2>Canvas size</h2>
      <label class="field">
        <span>Preset</span>
        <select id="canvasPreset">
          <option value="responsive">Responsive — fill screen</option>
          <option value="1200x1200">Square — 1200 × 1200</option>
          <option value="1600x1200">Landscape 4:3 — 1600 × 1200</option>
          <option value="1920x1080">Widescreen 16:9 — 1920 × 1080</option>
          <option value="1200x1600">Portrait 3:4 — 1200 × 1600</option>
          <option value="custom">Custom…</option>
        </select>
      </label>
      <div id="customSizeFields" class="dimension-fields hidden">
        <label class="field"><span>Width (px)</span><input id="canvasWidthInput" type="number" min="320" max="8192" step="1" value="1600" inputmode="numeric" /></label>
        <label class="field"><span>Height (px)</span><input id="canvasHeightInput" type="number" min="320" max="8192" step="1" value="1200" inputmode="numeric" /></label>
      </div>
      <label class="check-row"><input id="preserveCanvasCheck" type="checkbox" checked /> <span>Preserve existing artwork when resizing</span></label>
      <p class="settings-note">Fixed sizes determine both the canvas shape and the exact PNG dimensions. Responsive mode follows the available screen area.</p>
      <div class="settings-actions">
        <button value="cancel" class="utility">Cancel</button>
        <button id="applyCanvasSizeBtn" type="button" class="utility primary">Apply</button>
      </div>
    </form>
  </dialog>

  <dialog id="finishDialog" class="finish-dialog">
    <form method="dialog" class="finish-card">
      <div class="preview-wrap"><img id="previewImage" alt="Preview of your drawing" /></div>
      <div class="finish-actions">
        <button id="downloadBtn" type="button" class="utility primary">Download image</button>
        <button id="downloadSessionBtn" type="button" class="utility">Download session</button>
        <button value="close" class="utility">Keep drawing</button>
        <button id="newBtn" type="button" class="utility danger">Start again</button>
      </div>
    </form>
  </dialog>

  <script src="js/behaviors.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
