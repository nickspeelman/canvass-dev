<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <title>Touch Instrument — v1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app" aria-label="Touch drawing instrument">
    <section id="stage" class="stage" aria-label="Drawing canvas">
      <canvas id="paintCanvas"></canvas>
      <canvas id="liveCanvas"></canvas>
      <div id="touchHint" class="touch-hint">Touch the canvas</div>
    </section>

    <section class="controls" aria-label="Instrument controls">
      <div class="control-row behaviors" aria-label="Behaviors">
        <button class="behavior active" data-behavior="cycle" aria-pressed="true">Cycle</button>
        <button class="behavior" data-behavior="connect" aria-pressed="false">Connect</button>
        <button class="behavior" data-behavior="echo" aria-pressed="false">Echo</button>
        <button class="behavior" data-behavior="scatter" aria-pressed="false">Scatter</button>
        <button class="behavior" data-behavior="pull" aria-pressed="false">Pull</button>
        <button class="behavior" data-behavior="mirror" aria-pressed="false">Mirror</button>
      </div>

      <div class="control-row tools">
        <div class="swatches" aria-label="Color">
          <button class="swatch active" data-color="#e53935" aria-label="Red" aria-pressed="true" style="--swatch:#e53935"></button>
          <button class="swatch" data-color="#f6c90e" aria-label="Yellow" aria-pressed="false" style="--swatch:#f6c90e"></button>
          <button class="swatch" data-color="#1e66f5" aria-label="Blue" aria-pressed="false" style="--swatch:#1e66f5"></button>
          <button class="swatch" data-color="#111111" aria-label="Black" aria-pressed="false" style="--swatch:#111111"></button>
          <button class="swatch white" data-color="#ffffff" aria-label="White" aria-pressed="false" style="--swatch:#ffffff"></button>
        </div>

        <div class="sizes" aria-label="Brush size">
          <button class="size" data-size="6" aria-pressed="false">S</button>
          <button class="size active" data-size="16" aria-pressed="true">M</button>
          <button class="size" data-size="34" aria-pressed="false">L</button>
        </div>

        <div class="actions">
          <button id="fullscreenBtn" class="utility">Full screen</button>
          <button id="clearBtn" class="utility">Clear</button>
          <button id="finishBtn" class="utility primary">Finish</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="finishDialog" class="finish-dialog">
    <form method="dialog" class="finish-card">
      <div class="preview-wrap"><img id="previewImage" alt="Preview of your drawing" /></div>
      <div class="finish-actions">
        <button id="downloadBtn" type="button" class="utility primary">Download image</button>
        <button id="downloadSessionBtn" type="button" class="utility">Download session</button>
        <button value="close" class="utility">Keep drawing</button>
        <button id="newBtn" type="button" class="utility danger">Start again</button>
      </div>
    </form>
  </dialog>

  <script src="js/behaviors.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
