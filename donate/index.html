<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f1" />
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48x48.png" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static-pages.css" />
  <title>Support Canvas</title>
  <meta name="description" content="Support Canvas, a free experimental multitouch drawing instrument by Nick Speelman." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://canvas.nickspeelman.com/donate/" />
</head>
<body>
  <main class="page-card">
    <a class="brand" href="/" aria-label="Back to Canvas">
      <img src="/assets/icons/favicon-32x32.png" width="34" height="34" alt="" />
      <span>Canvas</span>
    </a>
    <h1>Support Canvas</h1>
    <p>Canvas is free to use. If you enjoy it and want to support the time, hosting, and experiments behind it, you can make a donation through PayPal.</p>
    <div id="paypal-donate-button-container" class="paypal-donate"></div>
    <div class="actions">
      <a class="button secondary" href="/">Back to Canvas</a>
    </div>
    <p class="note">Donations are optional and don’t unlock any additional features.</p>
  </main>

  <script src="https://www.paypalobjects.com/donate/sdk/donate-sdk.js" charset="UTF-8"></script>
  <script>
    if (window.PayPal?.Donation?.Button) {
      PayPal.Donation.Button({
        env: "production",
        hosted_button_id: "SJ8XEU3D7BW5J",
        image: {
          src: "https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif",
          title: "Donate with PayPal",
          alt: "Donate with PayPal button"
        },
        onComplete: function () {
          window.location.assign("/thankyou/");
        }
      }).render("#paypal-donate-button-container");
    } else {
      const container = document.getElementById("paypal-donate-button-container");
      const fallback = document.createElement("a");
      fallback.className = "button";
      fallback.href = "https://www.paypal.com/donate/?hosted_button_id=SJ8XEU3D7BW5J";
      fallback.rel = "nofollow";
      fallback.textContent = "Donate with PayPal";
      container.appendChild(fallback);
    }
  </script>
</body>
</html>
